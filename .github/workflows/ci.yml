name: CI

# pull_request でも動かす。push: [main] だけだと、
# PR の時点で落ちていることに気づけないまま main に入る。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 品質ゲートとテスト
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 品質ゲート
        run: npm run check

      # 検査そのものが壊れていないか（写しを1か所ずつ壊して、落ちることを見る）。
      # 「0件でした」が「守るものが無い」を意味していないことを毎回確かめる。
      - name: 検査そのものを確かめる
        run: npm run check:self

      - name: テスト
        run: npm test

      - name: JavaScript の構文
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs tools/*.mjs docs/*.js docs/lib/*.js; do
            node --check "$f"
          done

      # 生成物（feedback.json / history.json / media/manifest.json）は
      # まだ一度も動いていなければ存在しない。無いのは正常なので、あるときだけ見る。
      - name: JSON が読めるか
        run: |
          for f in config/*.json docs/manifest.webmanifest docs/launcher.json package.json \
                   data/feedback.json data/history.json data/gemini-model.json docs/media/manifest.json; do
            [ -f "$f" ] || continue
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "::error file=$f::JSON として読めません"; exit 1; }
          done

      # 生成物が最新の入力から作りなおせるか。
      # 手で docs/ を直したまま忘れる、という壊れ方をここで捕まえる。
      - name: 生成物が入力と食い違っていないか
        run: |
          npm run build:apps
          npm run build:sw
          if ! git diff --quiet -- docs/apps.html docs/sw.js; then
            echo "::error::docs/apps.html か docs/sw.js が入力と食い違っています。\`npm run build\` を実行してコミットしてください"
            git --no-pager diff --stat -- docs/apps.html docs/sw.js
            exit 1
          fi

      - name: 生成ずみの投稿がガードレールを通るか
        run: npm run lint:drafts

  # 正本（GIGAyama.github.io/standards/）からコピーしたファイルが、
  # 正本の更新に取り残されていないかを見る。standards-map.json が対応表。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
