name: 毎朝 — 今日の投稿を通知する

# ⚠️ cron は UTC。JST の朝に届けたいので、前日の夜の時刻を書くことになる。
#    日付は scripts/lib/jst.mjs が JST で判定するので、
#    UTC の日付とずれていても「JSTの今日」の投稿が選ばれる。
#
# ⚠️ 枠のぶんだけ cron を持つ。config/slots.json と対応させること。
#    以前は朝の1回だけで、夜のぶんは朝の Issue に一緒に載っているだけだった。
#    つまり夜の投稿は「朝に見たことを覚えている」ことが前提で、
#    README が「発信を続けるための要」と呼んでいる通知が、枠の半分に効いていなかった。
#    下の SLOT_BY_CRON と config/slots.json のずれは `npm run check` が検出する。
#
#    30 21 * * *  → 翌 06:30 JST … morning（7:00 の枠）
#    0  11 * * *  →    20:00 JST … evening（21:00 の枠）
#
# schedule は混雑時に遅れる。通知が1時間ずれることはあるが、
# 何時に出すかは人が決めるので実害は無い。
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '通知する日付（YYYY-MM-DD、JST）。空なら今日'
        type: string
        required: false
      slot:
        description: '知らせる枠（config/slots.json の id）。空ならその日ぶん全部'
        type: string
        required: false

permissions:
  contents: read
  issues: write

# ⚠️ 枠ごとに別のグループにする。1つにまとめて cancel-in-progress を立てると、
#    朝と夜が近い時刻にずれこんだときに、あとから来たほうが先のほうを打ち消す。
concurrency:
  group: daily-notify-${{ github.event.schedule || inputs.slot || 'manual' }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ⚠️ docs/ を取ってこない。
      #    通知が読むのは config/ と data/ だけで、docs/ は配信物である。
      #    そこには紹介カードが 29MB 入っていて、1日2回それを落とすのは無駄でしかない
      #    （Discord に出す画像は GitHub Pages の URL を参照するので、手元には要らない）。
      #    新しく読むところを増やしたときは、ここにも足すこと。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            config
            data
            package.json
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 通知に依存パッケージは要らないので npm ci はしない（起動を速くするため）。
      #
      # どの cron から来たかで枠を決める。手で回したときは inputs.slot（空なら全部）。
      # ⚠️ SLOT_BY_CRON は config/slots.json の id と揃っていること。
      #    枠を足して通知を足し忘れる、という壊れ方を npm run check が検出する。
      - name: この枠のぶんを通知する
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          # どの cron から来たかで枠を決める。ここが config/slots.json との対応表になる。
          slot="$INPUT_SLOT"
          if [ -n "$SCHEDULE" ]; then
            case "$SCHEDULE" in
              '30 21 * * *') slot=morning ;;
              '0 11 * * *')  slot=evening ;;
              *)
                echo "::error title=cron と枠の対応がありません::'$SCHEDULE' に対応する枠が daily-notify.yml に書かれていません"
                exit 1
                ;;
            esac
          fi

          # ⚠️ 配列で組む。`[ -n "$x" ] && args=...` の並びは、
          #    最後の行に来た瞬間に set -e で落ちる書き方になる。順序に依存させない。
          args=()
          if [ -n "$INPUT_DATE" ]; then
            case "$INPUT_DATE" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) args+=(--date "$INPUT_DATE") ;;
              *)
                echo "::error title=日付の形が違います::'$INPUT_DATE' は YYYY-MM-DD で渡してください"
                exit 1
                ;;
            esac
          fi
          if [ -n "$slot" ]; then
            args+=(--slot "$slot")
          fi

          echo "notify-daily.mjs ${args[*]}"
          node scripts/notify-daily.mjs "${args[@]}"
