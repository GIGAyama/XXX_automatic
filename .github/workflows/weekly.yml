name: 週次 — 翌週の投稿を用意する

# 日曜 11:00 UTC = 日曜 20:00 JST。
# ⚠️ GitHub Actions の cron は UTC で動く。JST のつもりで書くと9時間ずれる。
#    日付の計算はスクリプト側で scripts/lib/jst.mjs を通しているので、
#    多少発火が遅れても「翌週ぶん」の判定はずれない。
#
# schedule はベストエフォートで、混雑時は数十分遅れることがある。
# 翌週ぶんを作る処理なので、遅れても実害は出ない。
on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:
    inputs:
      force_profiles:
        description: 'プロフィールをキャッシュ無視で作りなおす'
        type: boolean
        default: false
      force_media:
        description: '画像を撮りなおす'
        type: boolean
        default: false

permissions:
  contents: write
  # 反応の記録（labels:feedback の Issue）を読んで、取り込んだら閉じるために要る。
  issues: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # ⚠️ ここを最初に置く理由
      #
      #   キーが未登録のまま走らせると、収集（1分）と依存の用意（1分）を
      #   全部やったあとで生成に失敗する。しかも失敗はリポジトリの数だけ並ぶので、
      #   本当の原因（キーが無い）がログに埋もれる。
      #   実際にそうなったので、何もしないうちに確かめる。
      - name: 必要な設定がそろっているか確かめる
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "✓ GEMINI_API_KEY は登録されています（${#GEMINI_API_KEY} 文字）"
            exit 0
          fi

          echo "::error title=GEMINI_API_KEY が登録されていません::投稿文を作れないのでここで止めます"
          cat <<'MSG'

          投稿文の生成には Gemini API キーが要ります。まだ登録されていません。

          ① キーを取る（無料・クレジットカード登録も不要）
               https://aistudio.google.com/apikey

          ② このリポジトリに登録する
               Settings → Secrets and variables → Actions
                 → New repository secret
               Name   : GEMINI_API_KEY
               Secret : ①で取ったキーを貼る

          ③ Actions →「週次 — 翌週の投稿を用意する」→ Run workflow

          （Name のつづりが1文字でも違うと空のまま渡ります。
            コピーして貼り付けるのが確実です。）

          MSG
          exit 1

      # 「登録されているが値が正しくない」はここでしか捕まえられない。
      # シークレットの有無だけ見て先へ進むと、リポジトリの数だけ同じ 400 が並び、
      # 本当の理由がその繰り返しに埋もれる（実際にそうなった）。
      # 1回だけ小さく投げて、2秒で決着させる。
      - name: Gemini API が本当に使えるか確かめる
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/check-gemini.mjs

      - name: 依存を入れる
        run: npm ci

      # スクリーンショットに日本語を出すために要る。
      # 入れないと豆腐（□□□）になり、原因が分かりにくい。
      - name: 日本語フォントを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Chromium を入れる
        run: npx playwright install --with-deps chromium

      # ⓪ と ⓪' は「先週までの結果」を翌週の材料にするための工程。
      # ここが無かったあいだ、README の「⑦ 記録」も rotation の設定も、
      # 書いてあるだけで実際には何も起きていなかった。
      #
      # 反応の記録は、取れなくても翌週の下書きは作れる。
      # 逆に下書きが作れないと発信そのものが止まる。だからここは続行にする。
      # （スクリプト自身は CLAUDE.md §6 のとおり、失敗を stderr に出して 1 で終わる。
      #   止めるかどうかの判断はワークフロー側の仕事なので、それをここに書いている。）
      - name: ⓪ 反応の記録を取り込む（失敗しても続行）
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run feedback

      # こちらは続行にしない。落ちると週をまたいだ重複回避が黙って効かなくなり、
      # 「なぜか先週と同じアプリばかり出る」という気づきにくい壊れ方をする。
      - name: ⓪' 終わった週を履歴に移す
        run: npm run archive

      - name: ① 収集 — リポジトリの素材を集める
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect

      - name: ② 理解 — アプリのプロフィールを作る
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/build-profiles.mjs ${{ inputs.force_profiles && '--force' || '' }}

      - name: ③ 素材 — スクリーンショットと紹介カード
        run: node scripts/capture-media.mjs ${{ inputs.force_media && '--force' || '' }}

      # 話題が拾えなくても、行事暦とプロフィールだけで投稿は作れる。
      # 週の投稿が作れなくなるほうが損失が大きいので、ここは続行にする。
      - name: ①' いまの話題を調べる（失敗しても続行）
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run trends

      - name: ④ 生成 — 翌週の X 投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate

      # ③' 記事に入れる画面。カード（③）とは別で、記事の本文に差しこむ操作中の画面を撮る。
      # 撮れなくても記事は書ける（文字だけになる）ので、ここで週次を止めない。
      # ⚠️ ④（X の生成）のあとに置くこと。その週の主題アプリは data/queue から決まる。
      - name: ③' 素材 — 記事に入れる画面（失敗しても続行）
        continue-on-error: true
        run: npm run shots

      - name: ④' 生成 — note の下書き
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run note

      # ①'' アプリのリポジトリに用意ずみの note 記事を取り込む。
      # 本人が書き上げた記事なので、生成した下書きより優先して出したいものである。
      # ⚠️ ① 収集のあとであれば、どこに置いてもよい（data/repos.json だけを見る）。
      #    取り込めなくても週の投稿と note の下書きは出せるので、ここで週次は止めない。
      - name: ①'' 用意された note 記事を取り込む（失敗しても続行）
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run note:repo

      - name: 検査 — ガードレール
        run: npm run lint:drafts

      # build:index（ランチャー用データ）→ build:apps（アプリ一覧）→ build:sw（キャッシュの版）。
      # build:sw は最後でなければならない。版はシェルの中身から計算するので、
      # 先に走らせると直したはずの画面が端末に届かない。
      - name: ⑤ ランチャー用のデータとアプリ一覧を組む
        run: npm run build

      - name: 検査 — 品質ゲート
        run: npm run check

      - name: コミットする
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data docs
          if git diff --staged --quiet; then
            echo "変更はありませんでした"
            exit 0
          fi
          git commit -m "chore: 翌週の投稿下書きを生成"
          # 他のワークフローが同時に push していることがある。1回だけ取り込んで再試行する。
          git push || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push)

  # ⚠️ 失敗を通知の経路に乗せる。
  #
  #   ここが無かったあいだ、週次が落ちたことに気づける手段は Actions の赤いバツだけだった。
  #   このシステムの通知は GitHub のモバイルアプリに寄せてあるのに（README「⑥ 通知」）、
  #   失敗だけがその経路の外にあった。
  #   しかも 60日ルールと噛み合うと、失敗が続いた末に定期実行そのものが黙って止まる。
  #
  #   同じラベルの Issue が開いていれば重ねて立てない（scripts/notify-failure.mjs）。
  notify-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # 依存は入れない。ここで使うのは fetch と Node 標準だけで、
      # しかも「本体が落ちたあと」に走るので、早く確実に届くことを優先する。
      - name: 失敗を知らせる
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notify-failure.mjs --workflow '週次' --run-id '${{ github.run_id }}'
