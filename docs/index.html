<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投稿ランチャー</title>
<meta name="description" content="用意された投稿を、スマホから3タップで X と note に出すためのランチャー">
<meta name="theme-color" content="#1d3557">

<!--
  外部からは何も読みこまない。
  学校のネットワークは CDN を塞いでいることがあり、
  読めないと画面が半分だけ崩れて原因が分からなくなる。
  このフリート共通の方針でもある。

  例外は raw.githubusercontent.com の画像だけ。
  アプリのリポジトリに置いてあるスクリーンショット（note の記事のために撮ったもの）を
  投稿に添えられるようにするため、img-src と connect-src の両方で許す。
  img-src はサムネイルの表示に、connect-src は共有シートへ渡す File を作る fetch に要る。
  片方だけ開けても動かない。実際、img-src だけ開けて画面は出るのに
  共有すると画像が付かない、という形で1度つまずいている。
  ここを広げる前に docs/lib/media-pick.js の isAllowedMediaSrc も合わせること。
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://raw.githubusercontent.com; style-src 'self'; script-src 'self'; connect-src 'self' https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="install-hook.js"></script>
</head>
<body>

<header class="head">
  <div class="head__row">
    <h1 class="head__title">投稿ランチャー</h1>
    <button id="install" class="ghost" hidden>ホーム画面に追加</button>
  </div>
  <p class="head__sub" id="summary" aria-live="polite">読み込んでいます…</p>
</header>

<nav class="tabs" role="tablist" aria-label="表示の切りかえ">
  <button class="tab is-on" id="tab-today" role="tab" data-view="today" aria-controls="list" aria-selected="true" tabindex="0">今日</button>
  <button class="tab" id="tab-week" role="tab" data-view="week" aria-controls="list" aria-selected="false" tabindex="-1">今週ぜんぶ</button>
  <button class="tab" id="tab-now" role="tab" data-view="now" aria-controls="list" aria-selected="false" tabindex="-1">いま出す</button>
  <button class="tab" id="tab-note" role="tab" data-view="note" aria-controls="list" aria-selected="false" tabindex="-1">note</button>
  <button class="tab" id="tab-done" role="tab" data-view="done" aria-controls="list" aria-selected="false" tabindex="-1">投稿ずみ</button>
  <button class="tab" id="tab-past" role="tab" data-view="past" aria-controls="list" aria-selected="false" tabindex="-1">過去</button>
</nav>

<!--
  aria-live は付けない。
  ここは再描画のたびに中身が総入れかわりするので、live にすると
  カードの本文が丸ごと読み上げられて、操作するどころではなくなる。
  変化の要約は上の #summary（polite）が担う。
-->
<main id="list" class="list" role="tabpanel" aria-labelledby="tab-today" tabindex="0"></main>

<!-- role="status" は暗黙で polite。aria-live を重ねると役割が競合する -->
<div id="toast" class="toast" role="status" data-show="off"></div>

<footer class="foot">
  <p>共有シートに X が出ないときは、［コピーして X を開く］を使ってください。<br>
     本文は共有ボタンを押した時点でクリップボードにも入っています。</p>
  <p><a href="apps.html">アプリの一覧を見る</a></p>
  <p id="stamp" class="foot__stamp"></p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
