<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投稿ランチャー</title>
<meta name="description" content="用意された投稿を、スマホから3タップで X と note に出すためのランチャー">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GIGA school">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="投稿ランチャー">
<meta property="og:description" content="用意された投稿を、スマホから3タップで X と note に出すためのランチャー">
<meta property="og:url" content="https://xxx-automatic.giga-school.com/">
<meta property="og:image" content="https://giga-school.com/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1d3557">

<!--
  外部からは何も読みこまない。
  学校のネットワークは CDN を塞いでいることがあり、
  読めないと画面が半分だけ崩れて原因が分からなくなる。
  このフリート共通の方針でもある。

  例外は raw.githubusercontent.com の画像だけ。
  アプリのリポジトリに置いてあるスクリーンショット（note の記事のために撮ったもの）を
  投稿に添えられるようにするため、img-src と connect-src の両方で許す。
  img-src はサムネイルの表示に、connect-src は共有シートへ渡す File を作る fetch に要る。
  片方だけ開けても動かない。実際、img-src だけ開けて画面は出るのに
  共有すると画像が付かない、という形で1度つまずいている。
  ここを広げる前に docs/lib/media-pick.js の isAllowedMediaSrc も合わせること。
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://raw.githubusercontent.com; style-src 'self'; script-src 'self'; connect-src 'self' https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="install-hook.js"></script>
</head>
<body>

<header class="head">
  <div class="head__row">
    <h1 class="head__title">投稿ランチャー</h1>
    <button id="install" class="ghost" hidden>ホーム画面に追加</button>
  </div>
  <p class="head__sub" id="summary" aria-live="polite">読み込んでいます…</p>
</header>

<!--
  タブは4つ。もとは7つ並んでいて、スマホでは端が切れて横スクロールになっていた。
  ［過去］は画面の外にあり、押せないものが並んでいるのは無いのと変わらなかった。

  今日・今週・予備は［出す］の中の切りかえに、投稿ずみ・過去は［記録］の中の切りかえにしてある。
  中身の選び方（docs/lib/select.js の view）は7つのままなので、
  送信ずみの Issue に残っている #now / #done のリンクはこれまでどおり効く。
-->
<nav class="tabs" role="tablist" aria-label="表示の切りかえ">
  <button class="tab is-on" id="tab-post" role="tab" data-tab="post" aria-controls="list" aria-selected="true" tabindex="0">出す</button>
  <button class="tab" id="tab-make" role="tab" data-tab="make" aria-controls="list" aria-selected="false" tabindex="-1">つくる</button>
  <button class="tab" id="tab-note" role="tab" data-tab="note" aria-controls="list" aria-selected="false" tabindex="-1">note</button>
  <button class="tab" id="tab-log" role="tab" data-tab="log" aria-controls="list" aria-selected="false" tabindex="-1">記録</button>
</nav>

<!--
  aria-live は付けない。
  ここは再描画のたびに中身が総入れかわりするので、live にすると
  カードの本文が丸ごと読み上げられて、操作するどころではなくなる。
  変化の要約は上の #summary（polite）が担う。
-->
<main id="list" class="list" role="tabpanel" aria-labelledby="tab-today" tabindex="0"></main>

<!-- role="status" は暗黙で polite。aria-live を重ねると役割が競合する -->
<div id="toast" class="toast" role="status" data-show="off"></div>

<footer class="foot">
  <p>共有シートに X が出ないときは、［コピーして X を開く］を使ってください。<br>
     本文は共有ボタンを押した時点でクリップボードにも入っています。</p>
  <p><a href="apps.html">アプリの一覧を見る</a>（一覧からアプリを選んで投稿を作れます）</p>
  <p><a href="https://giga-school.com/apps/xxx-automatic/" target="_blank" rel="noopener">使い方を読む</a>（giga-school.com の紹介記事）</p>
  <p id="stamp" class="foot__stamp"></p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
