<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>オフラインです - 投稿ランチャー</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f4f6f9;color:#1a2233;
       font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;
       line-height:1.8;padding:24px;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#12161d;color:#e8edf5}}
  .box{max-width:22rem}
  h1{font-size:20px;margin:0 0 12px}
  p{font-size:14.5px;margin:0 0 8px;opacity:.85}
  a{display:inline-block;margin-top:18px;color:inherit;font-weight:700;
    border:1.5px solid currentColor;border-radius:999px;padding:10px 22px;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <h1>電波が届いていないようです</h1>
    <p>投稿の下書きは、一度開いたことがあれば画面に残っています。</p>
    <p>本文は［コピーして X を開く］でクリップボードに入れられるので、電波が戻ってから貼り付けても大丈夫です。</p>
    <a href="./">もう一度ひらく</a>
  </div>
</body>
</html>
